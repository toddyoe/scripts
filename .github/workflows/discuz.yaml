name: Discuz论坛签到

on:
  schedule:
    - cron: '30 02 * * *'
  workflow_dispatch:

jobs:
  discuz-checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive

      - name: Prepare
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: InstallDeps
        run: pip3 install requests ddddocr==1.5.6

      - name: Checkin
        env:
          TASK_CONF_URL: ${{ secrets.DISCUZ_TASK_CONF_URL }}
        run: python -u ./discuz/main.py
