name: NodeSeek签到

on:
  schedule:
    - cron: '00 01 * * *'
  workflow_dispatch:

jobs:
  nodeseek-checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Sync
        run: |
          git submodule init
          git submodule update --remote

          # sync nodeseek-signin
          cd ./nodeseek

          git checkout main
          git pull -f origin main

          cd ..

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"

      - name: Checkin
        env:
          NS_COOKIE: ${{ secrets.NODESEEK_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.NODESEEK_TELEGRAM_BOT_TOKEN }}
          NS_RANDOM: ${{ vars.NODESEEK_RANDOM }}
        run: |
          pip3 install requests curl_cffi
          python -u ./nodeseek/nodeseek_sign.py
