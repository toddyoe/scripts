name: Follow签到

on:
  schedule:
    - cron: '45 00-15/9 * * *'
  workflow_dispatch:

jobs:
  nodeseek-checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Sync
        run: |
          git submodule init
          git submodule update --remote

          # sync AKA-Cigma/QLscripts
          cd ./cigma-ql

          git checkout main
          git pull -f origin main

          cd ..

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"

      - name: Checkin
        env:
          followck: ${{ secrets.FOLLOW_COOKIES }}
        run: |
          pip3 install requests
          python -u ./cigma-ql/follow.py
